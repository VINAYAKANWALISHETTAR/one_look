<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111214" />
    <title>One Look — Your day at a glance</title>
    <meta
      name="description"
      content="One Look is a calm personal command center: today's tasks, reminders and what needs your attention, in a single mobile-first view."
    />
    <meta property="og:title" content="One Look — Your day at a glance" />
    <meta
      property="og:description"
      content="A calm personal command center: today's tasks, reminders and what needs your attention, in one mobile-first view."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One Look" />
    <link rel="apple-touch-icon" href="/app/assets/icons/icon-192.png" />

    <link rel="stylesheet" href="/app/css/style.css" />
    <link rel="stylesheet" href="/app/css/components.css" />
    <link rel="stylesheet" href="/app/css/responsive.css" />
  </head>
  <body>
    <!-- Auth / lock surface -->
    <main id="auth-view" class="auth-view" hidden></main>

    <!-- Application shell -->
    <div id="app-view" class="app-view" hidden>
      <main id="screen" class="screen" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar" aria-label="Primary">
        <a class="tab" href="#/home" data-tab="home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" />
          </svg>
          <span>Home</span>
        </a>
        <a class="tab" href="#/tasks" data-tab="tasks">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h10M4 12h10M4 18h10" />
            <path d="M17.5 5.5 19 7l2.5-3" />
          </svg>
          <span>Tasks</span>
        </a>
        <a class="tab" href="#/inbox" data-tab="inbox">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3.5 7 8.5 6 8.5-6" />
          </svg>
          <span>Inbox</span>
        </a>
        <a class="tab" href="#/more" data-tab="more">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="5" cy="12" r="1.4" />
            <circle cx="12" cy="12" r="1.4" />
            <circle cx="19" cy="12" r="1.4" />
          </svg>
          <span>More</span>
        </a>
      </nav>
    </div>

    <div id="sheet-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <script type="module" src="/app/js/app.js"></script>
  </body>
</html>
